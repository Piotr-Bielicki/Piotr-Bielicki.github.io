<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who is Piotrek?</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            cursor: none; 
        }

        html, body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
            height: 200vh;
        }

        .cursor {
            position: fixed; top: 0; left: 0; width: 12px; height: 12px;
            background: #fff; border-radius: 50%; pointer-events: none;
            z-index: 9999; transform: translate(-50%, -50%);
            mix-blend-mode: difference; 
            transition: width 0.3s, height 0.3s, opacity 0.5s ease;
            opacity: 0; 
        }
        
        .cursor.hovered { width: 50px; height: 50px; background: transparent; border: 2px solid #fff; }

        @media (pointer: coarse) {
            .cursor {
                display: none !important;
            }
            * {
                cursor: auto;
            }
        }

        .webgl {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none;
        }

        .content-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: none;
        }

        .typing-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            width: 100%;
            padding: 0 20px;
            text-align: center;
            flex-wrap: wrap;
        }

        .massive-text {
            font-size: clamp(1.8rem, 4vw, 12rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            line-height: 1.1;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .blinking-cursor {
            display: inline-block;
            width: clamp(6px, 1vw, 20px);
            height: clamp(1.8rem, 4vw, 12rem);
            background-color: #ffffff;
            margin-left: 10px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .icons { display: flex; gap: 40px; pointer-events: auto; }
        .icons a { color: #ffffff; font-size: 2rem; text-decoration: none; transition: 0.3s; opacity: 0.5; }
        .icons a:hover { transform: translateY(-5px); opacity: 1; }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <canvas class="webgl"></canvas>

    <div class="content-layer">
        <div class="typing-container">
            <span id="name" class="massive-text"></span><span class="blinking-cursor"></span>
        </div>
        
        <div class="icons">
            <a href="https://www.instagram.com/whoispiotrek/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.linkedin.com/in/piotr-bielicki-7b82b4278/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="mailto:bielickipiotr@outlook.com"><i class="fas fa-envelope"></i></a>
        </div>
    </div>

    <script>
        const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        const cursor = document.getElementById('cursor');
        let cursorTimeout;

        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1, ease: "power2.out" });
            cursor.style.opacity = '1';
            
            clearTimeout(cursorTimeout);
            cursorTimeout = setTimeout(() => {
                cursor.style.opacity = '0';
            }, 2000);
        });

        document.querySelectorAll('.icons a').forEach(link => {
            link.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            link.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });

        const textToType = "Who is Piotrek?"; 
        let i = 0;
        function typeWriter() {
            if (i < textToType.length) {
                document.getElementById("name").innerHTML += textToType.charAt(i);
                i++;
                const speed = Math.random() * (150 - 80) + 80;
                setTimeout(typeWriter, speed);
            }
        }
        setTimeout(typeWriter, 500);

        const canvas = document.querySelector('canvas.webgl');
        const scene = new THREE.Scene();
        const geometry = new THREE.TorusKnotGeometry(10, 3, 200, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.15 });
        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);

        const sizes = { width: window.innerWidth, height: window.innerHeight };
        const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 1000);
        camera.position.z = 30;
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        let mouseX = 0; let mouseY = 0;
        const windowHalfX = window.innerWidth / 2; const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        gsap.registerPlugin(ScrollTrigger);
        gsap.to(torusKnot.rotation, { x: Math.PI * 2, z: Math.PI, scrollTrigger: { trigger: "body", start: "top top", end: "bottom bottom", scrub: 1 } });
        gsap.to(camera.position, { z: 12, scrollTrigger: { trigger: "body", start: "top top", end: "bottom bottom", scrub: 1 } });

        const clock = new THREE.Clock();
        function animate() {
            const time = clock.getElapsedTime();
            
            const organicX = Math.sin(time * 0.5) * 0.3;
            const organicY = Math.cos(time * 0.3) * 0.4;
            
            const targetX = (mouseY * 0.001) + organicX;
            const targetY = (mouseX * 0.001) + organicY;

            torusKnot.rotation.x += 0.05 * (targetX - torusKnot.rotation.x);
            torusKnot.rotation.y += 0.05 * (targetY - torusKnot.rotation.y);
            torusKnot.rotation.z += 0.001; 

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth; sizes.height = window.innerHeight;
            camera.aspect = sizes.width / sizes.height; camera.updateProjectionMatrix();
            renderer.setSize(sizes.width, sizes.height);
        });
    </script>
</body>
</html>
