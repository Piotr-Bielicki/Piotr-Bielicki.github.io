<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who is Piotrek</title>
    <!-- Ikona białego kwadracika w karcie przeglądarki -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22/></svg>">
    <!-- Pobieramy darmowe ikony od FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a; /* Głęboka, matowa czerń */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Subtelna poświata 3D w tle */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Kontener na efekt pisania */
        .typing-container {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 30px; /* Odstęp pod napisem przed ikonami */
            min-height: 3rem;
            display: flex;
            align-items: center;
        }

        /* Mrugający kursor */
        .cursor {
            display: inline-block;
            width: 2.5px;
            height: 2.2rem;
            background-color: #ffffff;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Kontener na ikony */
        .icons {
            display: flex;
            gap: 30px;
        }

        .icons a {
            color: #555555;
            font-size: 1.6rem;
            text-decoration: none;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        /* Efekt najechania myszką (Hover) */
        .icons a:hover {
            color: #ffffff;
            transform: translateY(-4px);
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="typing-container">
            <span id="name"></span><span class="cursor"></span>
        </div>

        <div class="icons">
            <a href="https://www.instagram.com/whoispiotrek/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.linkedin.com/in/piotr-bielicki-7b82b4278/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="mailto:bielickipiotr@outlook.com" title="Wyślij Email"><i class="fas fa-envelope"></i></a>
        </div>
    </div>

    <script>
        const textToType = "Who is Piotrek?"; 
        const speed = 120; // Szybkość pisania w milisekundach
        let i = 0;

        function typeWriter() {
            if (i < textToType.length) {
                document.getElementById("name").innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        window.onload = typeWriter;
    </script>

</body>
</html>
